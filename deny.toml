# cargo-deny config for Kami. Run: `cargo deny check`.

[graph]
all-features = false
no-default-features = false

[output]
feature-depth = 1

# ---------------------------------------------------------------- advisories
[advisories]
ignore = []

# ------------------------------------------------------------------ licenses
[licenses]
# Every license actually present in this workspace's dependency graph, as
# of the last `cargo deny check licenses` run. A new dependency pulling in
# something outside this list should fail the check rather than pass
# silently — extend this list deliberately, not by copying a template.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
# Our own crates are internal ELCI tooling (`publish = false`, license
# "UNLICENSED" — not a valid SPDX expression) and must not be run through
# the public-license allow list above.
ignore = true

# ---------------------------------------------------------------------- bans
[bans]
multiple-versions = "warn"
wildcards = "allow"
allow-workspace = true

# -------------------------------------------------------------------- sources
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
