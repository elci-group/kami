[workspace]
resolver = "2"
members = [
    "crates/kami-cli",
    "crates/kami-core",
    "crates/kami-evidence",
    "crates/kami-elci",
    "crates/kami-sizing",
    "crates/kami-battery",
    "crates/kami-findings",
    "crates/kami-padagonia",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
which = "6"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
